name: CI

# Every pull request to main: install, lint, test, build. The autopilot
# (.claude/skills/autopilot) waits for this check before it merges, and a
# red check stops any merge from deploying something broken (deploy.yml runs
# the same steps again on main before it publishes). Beside it, the AI's
# tests, the multiplayer's two-browser check (evidence, not a gate), and
# the Star Wars worlds booted on the node renderer (a gate: every world up,
# no error; the rows reported).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage:bf2017
      - run: npm run maps:bf2017
      # the build as the deploy makes it with the asset bucket set (a stand-in
      # URL: nothing is fetched), then as it is without, which the checks read
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_ASSET_BASE: https://assets.invalid/storage/v1/object/public/assets
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # the build's WebAssembly binaries valid and all there, as the deploy checks
      - run: node scripts/wasm-check.mjs dist
      # the codebase's health against docs/health/budgets.json: a number over
      # its budget is a red check, the same as a failing test (docs/health)
      - run: node scripts/health.mjs --check --skip build

  # The Star Wars worlds on the node renderer (the picture-everywhere design,
  # lane T2): each of the seventeen surfaces booted at high in software GL
  # (SwiftShader has no WebGPU, so it is the node renderer over WebGL 2,
  # 'nodes-webgl'), held to its row of the budget table and its baseline
  # (scripts/galaxy-check.mjs BUDGET=1): no page error, no console error,
  # draw calls, triangles and models within the row. A job a world, as a
  # world with a level pack takes minutes to come up in software. The gate is
  # that every world comes up and says no error (scripts/lib/noise.mjs's
  # noise aside); the rows are reported, not held (BUDGET_REPORT=1): a frame
  # through the node renderer's whole chain takes minutes on a runner's
  # software GL and its cascades' frame cannot be counted there (Hoth at
  # high, 2026-10-11), so the frame numbers are the owner's laptop run's
  # (docs/superpowers/evidence/bf2017-picture/t2/README.md).
  worlds:
    name: Worlds on the node renderer (${{ matrix.world }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        # (a world a job: a frame of a whole level takes 5 to 50 s in software
        # GL, so eight worlds in one 150-minute job never all came round, on
        # 6e46fde0 shard 1 measured seven and shard 2 three before the limit,
        # Geonosis alone 57 minutes; one each, a slow world keeps no other
        # from being measured. Tatooine's has its own reason too: since its
        # pack (#910) nearly every one of its materials compiles its own
        # program, 369 for 379 against Hoth's 141 for 564, each a synchronous
        # link in SwiftShader. docs/superpowers/evidence/bf2017-picture/t2/README.md)
        world: [hoth, endor, yavin, bespin, dagobah, mustafar, coruscant, naboo, kashyyyk, kamino, geonosis, scarif, nevarro, mandalore, lothal, sorgan, tatooine]
      # (DRAW_WAIT, 50 minutes: a world is prepared out of sight before it
      # shows, a slice of its pictures and shaders a frame, and a frame of
      # Tatooine's whole level takes 15 to 20 s here; its warm-up took most
      # of a 54-minute run on 2026-10-11 against the 10-minute default.
      # A ceiling, not a wait: a world that comes up sooner goes on)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright-core install --with-deps chromium

      # the dev server with the public bucket (a variable, not a secret) as
      # the asset base, as the deploy builds it, and a wait till it answers.
      # (bound to 127.0.0.1, where galaxy-check asks: on the runner
      # `localhost` answers on ::1 alone, and the check found nothing there)
      - run: |
          npx vite --host 127.0.0.1 --port 5188 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5188/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat vite.log
          exit 1
        env:
          VITE_ASSET_BASE: ${{ vars.ASSET_BASE }}

      - shell: bash
        run: |
          CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" BUDGET=1 BUDGET_REPORT=1 QUALITY=high VIEW=640x360 SHOT_WAIT=900000 PHASE_WAIT=900000 DRAW_WAIT=3000000 OUT=worlds node scripts/galaxy-check.mjs surface ${{ matrix.world }} 2>&1 | tee worlds-check.log
          exit ${PIPESTATUS[0]}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-${{ matrix.world }}
          path: |
            worlds/
            worlds-check.log
            vite.log
          if-no-files-found: ignore

  # The AI and the models (scripts/ai-e2e/README.md): the pipelines with
  # fake engines, the shipped assets, the brains, the agent's guards. A job
  # of its own so a slow contract test never holds up the first one's answer.
  ai:
    name: AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # two deep: the render step diffs the merge commit against main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # the voices contract tests run the pipeline's Python with the fake
      # worker and ears: numpy and soundfile are all those need (no torch, no
      # engines), and ffmpeg publishes the mp3s
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy soundfile
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)

      - run: npm ci
      - run: npm run test:ai

      # tier 3, every model draws: only when the pull request touches a model
      # or the code that draws one (render/changed.mjs), as it needs a browser
      - id: changed
        run: node scripts/ai-e2e/render/changed.mjs
      - id: playwright
        if: steps.changed.outputs.render == 'true'
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.render == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.changed.outputs.render == 'true'
        run: npx --yes playwright@${{ steps.playwright.outputs.version }} install --with-deps chromium
      - if: steps.changed.outputs.render == 'true'
        run: npm run test:ai:render
      - if: always() && steps.changed.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: scripts/ai-e2e/render/out/
          if-no-files-found: ignore

  # Multiplayer in two browsers (scripts/online-check.mjs --universe: Alpha
  # and Bravo meet on the universe map, see each other's tags and become
  # allies; then scripts/flyto-check.mjs: Alpha flies to Bravo, and Bravo
  # goes offline mid-trip) on the fake relay (scripts/lib/fake-relays.mjs,
  # RELAY=fake), so no network is needed; from the squads' second pull
  # request on, scripts/squad-check.mjs runs the same way. Evidence, not a
  # gate: a red run is read, then fixed or explained in the pull request.
  # (Each check runs in `shell: bash`, which has pipefail, so a check that
  # fails fails its step through the tee that keeps its lines.)
  online:
    name: Multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright-core install --with-deps chromium

      # the dev server in the background, and a wait till it answers
      - run: |
          npx vite --port 5173 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat vite.log
          exit 1

      - shell: bash
        run: |
          RELAY=fake CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" node scripts/online-check.mjs --universe 2>&1 | tee online-check.log

      # the fly-to check, whatever the first came to. Reported, but it doesn't
      # turn the job red: two pages drawing in software on a runner send their
      # poses seconds apart, past STALE_MS (2.5 s, online/protocol.js), and the
      # trip then rightly ends "has gone" (with two browsers it had never been
      # run till this job: docs/superpowers/HANDOFF-multiplayer-economy.md)
      - if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          RELAY=fake CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" node scripts/flyto-check.mjs 2>&1 | tee flyto-check.log

      # planet flight: begin (scripts/flight-island.mjs removes this block)
      # the shared world over a planet (online-check.mjs --fly): two pilots
      # heard by cell, a turret built, kept over a reload and shot to nothing,
      # the durable world faked in the check (scripts/lib/fake-durable.mjs)
      # (the turret's time is taken in the two pages, so a long software frame
      # holding the harness's calls doesn't count against its 3 s)
      - if: ${{ !cancelled() }}
        shell: bash
        run: |
          RELAY=fake CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" node scripts/online-check.mjs --fly 2>&1 | tee fly-check.log
      # planet flight: end

      # what each said, as a note on the check (readable where the log isn't)
      - if: always()
        shell: bash
        run: |
          for log in *-check.log; do
            [ -f "$log" ] || continue
            check="${log%.log}"
            lines=$(grep -E '^(ok|FAIL|note|fly:|errors:|ALL OK|[0-9]+ FAILED|     )' "$log" | cut -c1-300 | sed -e 's/%/%25/g' | awk 'NR <= 40 { printf "%s%%0A", $0 }' || true)
            echo "::notice title=${check}::${lines}"
          done
