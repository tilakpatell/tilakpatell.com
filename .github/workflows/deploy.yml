name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# (one deploy at a time, each merge's in turn: with the deploy in progress
# cancelled on every push, an evening of nine merges left the site at the
# first one's build for hours, 2026-10-11)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # the public bucket held to its manifests (scripts/assets-check.mjs):
      # every published file there at its size, a year's cache, before a
      # build that sends visitors to it
      - if: ${{ vars.ASSET_BASE != '' }}
        run: node scripts/assets-check.mjs
        env:
          ASSET_BASE: ${{ vars.ASSET_BASE }}
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the durable world's project: a URL and the public anon key (RLS guards
          # the tables). Unset, the build makes no client and the game plays without it
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # the public bucket site-assets (a variable, not a secret): where the
          # heavy models are asked first, and where the game-derived files
          # live (scripts/assets-upload.mjs, scripts/assets-publish.mjs).
          # Unset, every file comes from the site as before
          VITE_ASSET_BASE: ${{ vars.ASSET_BASE }}
      # every WebAssembly binary the build publishes valid, and every one a
      # chunk asks for there (scripts/wasm-check.mjs; Pages serves .wasm as
      # application/wasm, docs/stack/webassembly.md)
      - run: node scripts/wasm-check.mjs dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
