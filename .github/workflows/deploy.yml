name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full-check:
        description: 'Hold every file in the bucket to the manifests, not only what changed since the last deploy (half an hour, and the bucket’s whole egress once)'
        type: boolean
        default: false

permissions:
  contents: read
  # the last deploy that went out, read from the Actions API for the assets check
  actions: read

# A deploy took about forty minutes then (about twelve by 2026-10-21), and a
# merge to main lands more often than that when several sessions work at once: with the running deploy
# cancelled by each new one, nothing reached the site for hours (2026-10-13:
# five merges, four deploys cancelled, none finished). So the running one
# finishes, and of those waiting only the newest is kept.
concurrency:
  group: deploy
  cancel-in-progress: false

# One job: lint, test and build `main`, then the build's files to Cloudflare,
# the Worker tilakpatell-com (wrangler.jsonc: the files and nothing else, and
# the account; docs/stack/cloudflare.md). Its environment, `cloudflare`,
# lists each deploy in the repository's Deployments with the site's address,
# marked done when the upload has gone through. (Until 2026-10-21 the files
# went to GitHub Pages, and then to the Worker too while the domain moved:
# docs/decisions/2026-10-21-cloudflare-for-the-site.md.)
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://tilakpatell.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # the public bucket held to its manifests (scripts/assets-check.mjs):
      # a published file there at its size, a year's cache, before a build
      # that sends visitors to it. Only the files the manifests gained or
      # changed since the last deploy that went out (its commit from the
      # Actions API, fetched so the script can read the manifests as they
      # were): those before were held then, and a bucket path is never
      # overwritten. Every file only on a run by hand with full-check, or when
      # no earlier deploy is found. (Until 2026-10-15 every deploy asked all
      # 77,545 files: half an hour each, and, if the CDN counts a one-byte
      # range as the whole file, the bucket's 14 GB of egress a deploy; the
      # month's 28 deploys and its 387 GB of cached egress are that sum.)
      - if: ${{ vars.ASSET_BASE != '' }}
        id: last-deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ inputs.full-check }}
        run: |
          since=""
          if [ "$FULL" != "true" ]; then
            since=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$since" ] && ! git fetch --depth=1 origin "$since"; then
              echo "the last deploy's commit $since could not be fetched: every file is checked"
              since=""
            fi
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "assets check since: ${since:-(every file)}"
      - if: ${{ vars.ASSET_BASE != '' }}
        run: node scripts/assets-check.mjs ${SINCE:+--since "$SINCE"}
        env:
          ASSET_BASE: ${{ vars.ASSET_BASE }}
          SINCE: ${{ steps.last-deploy.outputs.since }}
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the durable world's project: a URL and the public anon key (RLS guards
          # the tables). Unset, the build makes no client and the game plays without it
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # the public bucket site-assets (a variable, not a secret): where the
          # heavy models are asked first, and where the game-derived files
          # live (scripts/assets-upload.mjs, scripts/assets-publish.mjs).
          # Unset, every file comes from the site as before
          VITE_ASSET_BASE: ${{ vars.ASSET_BASE }}
      # every WebAssembly binary the build publishes valid, and every one a
      # chunk asks for there (scripts/wasm-check.mjs; the Worker serves .wasm
      # as application/wasm, docs/stack/webassembly.md)
      - run: node scripts/wasm-check.mjs dist

      # Wrangler sends only the files the Worker doesn't hold already (the
      # first time, 11,362 files in under four minutes; after, about 30 s).
      # (Its free plan takes 20,000 files and 25 MiB a file: on 2026-10-21
      # wrangler counted 12,279 of dist/'s 11,565, and none over.)
      - name: The build to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::the secret CLOUDFLARE_API_TOKEN is missing (docs/stack/cloudflare.md)"; exit 1; }
          npx --yes wrangler@4.149.0 deploy
