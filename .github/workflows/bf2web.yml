name: bf2-web manifest audit
run-name: 'Read-only manifest audit: codex-20261106-5c6d5a3a'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bf2web-manifest-audit18
  cancel-in-progress: false
jobs:
  manifest-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/lib
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read only the pinned published manifest and verify its bytes
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {open,BUCKET} from './scripts/lib/bf2web-r2.mjs';
          import {objectUrl} from './scripts/lib/bucket.mjs';
          const key='sites/codex-20261106-5c6d5a3a/manifest.json';
          const expectedSha256='d3a3556bbf4f45654d7023c0f450c584bf5a9542eafe95f32005f7dc96511fd4';
          const expectedBytes=2841200;
          const startedUtc=new Date().toISOString();
          const response=await open().fetch(objectUrl(BUCKET,key),{method:'GET',redirect:'error',headers:{'accept-encoding':'identity'},signal:AbortSignal.timeout(60000)});
          assert.equal(response.status,200);
          const chunks=[];let size=0;
          for await(const chunk of response.body){size+=chunk.length;assert.ok(size<=expectedBytes,'bounded manifest response');chunks.push(Buffer.from(chunk));}
          const body=Buffer.concat(chunks),sha256=createHash('sha256').update(body).digest('hex');
          assert.equal(size,expectedBytes);assert.equal(sha256,expectedSha256);
          fs.mkdirSync('manifest-audit');fs.writeFileSync('manifest-audit/manifest.json',body);
          const receipt={schema:'ci-authenticated-bucket-manifest/1',passed:true,startedUtc,finishedUtc:new Date().toISOString(),transport:'R2 S3 authenticated AWS Signature V4 GET using existing publisher signer',bucket:BUCKET,key,status:response.status,requestCount:1,bytes:size,sha256,expectedSha256,expectedBytes,headers:Object.fromEntries(['content-type','content-length','content-encoding','etag','last-modified'].map(k=>[k,response.headers.get(k)])),run:process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA};
          fs.writeFileSync('manifest-audit/receipt.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify({passed:true,bytes:size,sha256,requestCount:1}));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-codex-20261106-5c6d5a3a
          path: manifest-audit/
          if-no-files-found: error
          retention-days: 1
