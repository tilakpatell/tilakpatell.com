    <script>
      try {
        var m = localStorage.getItem('tp-mode');
        if (m === 'dark' || (!m && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.mode = 'dark';
        // A colour picked this visit lands with the first paint, not after the
        // app mounts (AWS’s showed first). The visitor’s own colour waits for
        // the app, which computes its tokens.
        // Settings, Motion: Reduced, before anything on the page reads it
        var calm = localStorage.getItem('tp-motion') === 'reduced';
        if (calm) document.documentElement.dataset.motion = 'reduced';
        var p = sessionStorage.getItem('tp-theme-pin');
        if (p && p !== 'custom' && /^[a-z0-9]+$/.test(p)) document.documentElement.dataset.theme = p;
        // First visit to the home page: cover it until the hyperspace intro starts.
        var h = location.hash;
        if (!localStorage.getItem('tp-intro') && (h === '' || h === '#' || h === '#/') && !calm && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.intro = '1';
      } catch (e) {}
    </script>
    <style>
      html { background: #fdfdfc; }
      html[data-mode='dark'] { background: #09090b; }
      /* The intro's cover. It removes itself after 4s even if the script never runs. */
      html[data-intro] body::before { content: ''; position: fixed; inset: 0; z-index: 94; background: #03070f; animation: intro-cover 0.4s ease 4s forwards; }
      @keyframes intro-cover { to { opacity: 0; visibility: hidden; } }
    </style>
