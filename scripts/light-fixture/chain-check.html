<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>chain check</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      // Our chain builder on three's TRAA example scene: a spinning cube and a
      // ground under a sun, no fixture world, no sky. ?chain=render,traa,output
      import * as THREE from 'three/webgpu';
      import { buildChain } from '/src/lib/three/light/passes.js';

      const q = new URLSearchParams(location.search);
      const kinds = (q.get('chain') ?? 'render,traa,output').split(',');
      const state = { ready: false, error: null, frames: 0 };
      window.__chk = state;
      try {
        const canvas = document.querySelector('canvas');
        const renderer = new THREE.WebGPURenderer({ canvas, antialias: q.get('aa') === '1', forceWebGL: q.get('gpu') === 'webgl' });
        renderer.setPixelRatio(1);
        renderer.setSize(innerWidth, innerHeight);
        renderer.toneMapping = THREE.NeutralToneMapping;
        await renderer.init();
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x203040);
        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 2, 6);
        camera.lookAt(0, 0.5, 0);
        const sun = new THREE.DirectionalLight(0xffffff, 3);
        sun.position.set(3, 5, 2);
        sun.castShadow = true;
        scene.add(sun, new THREE.HemisphereLight(0x8899bb, 0x443322, 0.6));
        const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardNodeMaterial({ color: 0xcc8844, roughness: 0.6 }));
        cube.position.y = 0.5;
        cube.castShadow = true;
        scene.add(cube);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardNodeMaterial({ color: 0x999999, roughness: 0.3, metalness: 0 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        for (let i = 0; i < 6; i++) {
          const s = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 16), new THREE.MeshStandardNodeMaterial({ color: 0xdddddd, roughness: 0.2, metalness: 1 }));
          s.position.set(Math.cos((i / 6) * Math.PI * 2) * 2, 0.3, Math.sin((i / 6) * Math.PI * 2) * 2);
          scene.add(s);
        }
        const passes = kinds.map((kind) => (kind === 'render' ? { kind, scene, camera } : { kind }));
        const chain = await buildChain(renderer, passes);
        state.backend = renderer.backend.isWebGLBackend ? 'nodes-webgl' : 'webgpu';
        state.passes = kinds;
        // ?raf=1: a frame yielded between draws, as a page's loop does
        const raf = q.get('raf') === '1';
        state.draw = async (n = 1) => {
          for (let i = 0; i < n; i++) {
            if (raf) await new Promise((r) => requestAnimationFrame(r));
            cube.rotation.y += 0.01;
            chain.pipeline.render();
            state.frames++;
          }
          if (renderer.backend.device) await renderer.backend.device.queue.onSubmittedWorkDone();
        };
        state.ready = true;
      } catch (e) {
        state.error = String(e?.stack ?? e);
      }
    </script>
  </body>
</html>
