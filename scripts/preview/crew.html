<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy crew sheet</title>
    <!--
      The galaxy's Meshy people (scripts/meshy-galaxy.mjs), in a row on a
      metre grid, each loaded the way the game loads them
      (footScene.js loadPartyFigure, with Rick's clips borrowed) and walking
      on the spot; the still one (no skeleton) stands at the end. Through the
      dev server (npx vite):
        /scripts/preview/crew.html                       walking, three-quarter
        …?move=0                                        at idle (0…1: idle, walk, run)
        …&view=front | side | three                     from where
        …&only=luke,han                                 some of them
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #20242c;
        color: #e9edf2;
        font: 13px/1.3 system-ui, sans-serif;
        overflow: hidden;
      }
      #labels div {
        position: absolute;
        transform: translate(-50%, 0);
        padding: 2px 6px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        white-space: nowrap;
        pointer-events: none;
      }
      #status {
        position: absolute;
        left: 12px;
        top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <div id="status">loading…</div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
      import { loadPartyFigure } from '/src/components/universe/footScene.js';
      import { METRE } from '/src/components/universe/foot.js';

      const CREW = [
        { id: 'luke', tall: 1.72 },
        { id: 'leia', tall: 1.5 },
        { id: 'han', tall: 1.85 },
        { id: 'mando', tall: 1.85 },
        { id: 'ahsoka', tall: 1.85 },
        { id: 'oldben', tall: 1.82 },
        { id: 'greedo', tall: 1.73 },
        { id: 'gamorrean', tall: 1.8 },
        { id: 'bobafett', tall: 1.83 },
        { id: 'bith', tall: 1.8 },
        { id: 'jabba', tall: 1.8, still: true },
      ];
      const q = new URLSearchParams(location.search);
      const move = Number(q.get('move') ?? 0.45);
      const view = q.get('view') ?? 'three';
      const only = q.get('only')?.split(',');
      const status = document.getElementById('status');

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.prepend(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#20242c');
      scene.add(new THREE.HemisphereLight('#dfe8ff', '#4a3f33', 1.4));
      const sun = new THREE.DirectionalLight('#fff4e0', 2.6);
      sun.position.set(-4, 8, 6);
      scene.add(sun);

      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      const placed = [];
      let x = 0;
      for (const c of CREW.filter((c) => !only || only.includes(c.id))) {
        const url = `/models/galaxy/crew/${c.id}.glb`;
        let fig = null;
        try {
          if (c.still) fig = { model: (await loader.loadAsync(url)).scene, update() {} };
          else {
            fig = await loadPartyFigure({ id: c.id, name: c.id, tall: c.tall, src: { url } }, null);
            // the game's figures stand in map units: back to metres
            fig.model.scale.divideScalar(METRE);
            fig.model.position.y /= METRE;
          }
        } catch (e) {
          console.error(c.id, e);
        }
        const box = fig ? new THREE.Box3().setFromObject(fig.model) : null;
        const w = box ? Math.max(1, box.getSize(new THREE.Vector3()).x) : 1;
        x += w / 2;
        if (fig) {
          fig.model.position.x = x;
          scene.add(fig.model);
        }
        placed.push({ ...c, fig, at: x });
        x += w / 2 + 0.4;
      }
      const span = x;
      const grid = new THREE.GridHelper(Math.ceil(span + 20), Math.ceil(span + 20), '#5a6270', '#363c46');
      grid.position.x = span / 2;
      scene.add(grid);

      // play the clips a while (as the game does, a frame at a time), then look
      for (let i = 0; i < 40; i++) for (const p of placed) p.fig?.update(1 / 30, move);
      const heights = placed.map((p) => {
        if (!p.fig) return null;
        p.fig.model.updateMatrixWorld(true);
        const b = new THREE.Box3().setFromObject(p.fig.model);
        return { top: b.max.y, low: b.min.y };
      });

      const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 500);
      const mid = new THREE.Vector3(span / 2, 0.95, 0);
      const far = Math.max(span * 1.55, 6);
      const from = { three: [0.6, 0.18, 1], front: [0, 0.08, 1], side: [1, 0.08, 0] }[view] ?? [0.6, 0.18, 1];
      camera.position.copy(mid).add(new THREE.Vector3(...from).normalize().multiplyScalar(far));
      camera.lookAt(mid);
      renderer.render(scene, camera);

      const labels = document.getElementById('labels');
      placed.forEach((p, i) => {
        const h = heights[i];
        const s = new THREE.Vector3(p.at, (h?.top ?? 1) + 0.12, 0).project(camera);
        const d = document.createElement('div');
        d.style.left = `${((s.x + 1) / 2) * innerWidth}px`;
        d.style.top = `${((1 - s.y) / 2) * innerHeight - 22}px`;
        d.textContent = h ? `${p.id} ${h.top.toFixed(2)} m (feet ${h.low.toFixed(2)})` : `${p.id}: no glb`;
        labels.append(d);
      });
      status.textContent = `${placed.filter((p) => p.fig).length} of ${placed.length} (move ${move}, view ${view})`;
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
